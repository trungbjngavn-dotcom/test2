<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Descent: Cell to Quantum Field</title>
<style>
:root{--fg:#e8f1ff;--dim:rgba(215,232,255,.66);--accent:#8fd8ff}
html,body{margin:0;height:100%;background:#010207;overflow:hidden;color:var(--fg);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;cursor:default}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 2s ease;text-align:center;padding:0 16px}
#intro.show{opacity:1}
#intro h1{font-weight:200;letter-spacing:.55em;font-size:clamp(30px,6.5vw,78px);margin:0 0 .35em;padding-left:.55em;text-shadow:0 0 34px rgba(120,200,255,.5),0 0 12px rgba(0,0,0,.9)}
#intro p{font-weight:300;letter-spacing:.2em;font-size:clamp(10px,1.3vw,14px);color:var(--dim);margin:0;text-transform:uppercase}
#cap{position:fixed;left:clamp(16px,4vw,56px);top:clamp(16px,6vh,64px);max-width:min(430px,calc(100vw - 32px));opacity:0;transform:translateY(10px);transition:opacity 1s ease,transform 1s ease;pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.9)}
#cap.show{opacity:1;transform:none}
#cap .k{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
#cap h2{font-weight:300;font-size:clamp(22px,2.8vw,34px);margin:0 0 12px;letter-spacing:.02em}
#cap p{font-weight:300;font-size:clamp(13px,1.2vw,15px);line-height:1.62;color:var(--dim);margin:0}
#cap .lg{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim)}
#cap .lg span{display:inline-flex;align-items:center;gap:6px}
#cap .lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
#finale{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px 13vh;pointer-events:none;text-align:center}
#finale .big{font-weight:200;font-size:clamp(18px,2.6vw,32px);letter-spacing:.03em;max-width:900px;line-height:1.45;margin:0 0 14px;opacity:0;transition:opacity 2.5s ease;text-shadow:0 0 24px rgba(0,0,0,.9)}
#finale .small{font-size:12px;color:rgba(200,220,255,.45);letter-spacing:.06em;margin:0 0 22px;opacity:0;transition:opacity 2s ease}
#finale button{pointer-events:auto;background:rgba(140,200,255,.08);color:var(--fg);border:1px solid rgba(160,210,255,.35);border-radius:999px;padding:10px 26px;font:300 14px inherit;letter-spacing:.2em;cursor:pointer;opacity:0;transition:opacity 1.5s ease,background .3s}
#finale button:hover{background:rgba(140,200,255,.2)}
#finale.s1 .big,#finale.s2 .small,#finale.s2 button{opacity:1}
#help{position:fixed;right:16px;bottom:12px;font-size:11px;color:rgba(200,220,255,.34);letter-spacing:.08em;pointer-events:none}
@media (max-width:700px){#help{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro"><h1>DESCENT</h1><p>From a living cell to the quantum vacuum &nbsp;·&nbsp; eleven orders of magnitude</p></div>
<div id="cap"><div class="k"></div><h2></h2><p></p><div class="lg"></div></div>
<div id="finale"><p class="big">Every cell, every strand of DNA, every atom of you — the same few fields, ringing.</p><p class="small">Distances are to scale. Motion is slowed and structures simplified for clarity.</p><button id="replay">↻ &nbsp;REPLAY</button></div>
<div id="help">space pause · ← → chapters · R restart</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1,D=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);D=Math.max(W,H*1.45);}
addEventListener('resize',resize);resize();

/* ---------------- utilities ---------------- */
const TAU=Math.PI*2,DEG=Math.PI/180;
const clamp=(x,a,b)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const P8=new Uint8Array(512);{const r=mulberry32(2024),p=[];for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=(r()*(i+1))|0,q=p[i];p[i]=p[j];p[j]=q}for(let i=0;i<512;i++)P8[i]=p[i&255]}
function g3(h,x,y,z){h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v)}
function fd(t){return t*t*t*(t*(t*6-15)+10)}
function noise3(x,y,z){let X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);x-=X;y-=Y;z-=Z;X&=255;Y&=255;Z&=255;const u=fd(x),v=fd(y),w=fd(z);const A=P8[X]+Y,AA=P8[A]+Z,AB=P8[A+1]+Z,B=P8[X+1]+Y,BA=P8[B]+Z,BB=P8[B+1]+Z;
return lerp(lerp(lerp(g3(P8[AA],x,y,z),g3(P8[BA],x-1,y,z),u),lerp(g3(P8[AB],x,y-1,z),g3(P8[BB],x-1,y-1,z),u),v),lerp(lerp(g3(P8[AA+1],x,y,z-1),g3(P8[BA+1],x-1,y,z-1),u),lerp(g3(P8[AB+1],x,y-1,z-1),g3(P8[BB+1],x-1,y-1,z-1),u),v),w)}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')'}
function mixc(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function scl(c,k){return[Math.min(255,c[0]*k),Math.min(255,c[1]*k),Math.min(255,c[2]*k)]}
const WHITE=[255,255,255];
function glowSpr(col,size,core){size=size||64;core=core||.2;const c=mk(size,size),x=c.getContext('2d'),r=size/2,g=x.createRadialGradient(r,r,0,r,r,r);g.addColorStop(0,rgba(mixc(col,WHITE,.6),1));g.addColorStop(core,rgba(col,.6));g.addColorStop(.5,rgba(col,.14));g.addColorStop(1,rgba(col,0));x.fillStyle=g;x.fillRect(0,0,size,size);return c}
function ballSpr(col,b,size){size=size||128;const c=mk(size,size),x=c.getContext('2d'),r=size/2;const g=x.createRadialGradient(r*.66,r*.6,r*.03,r*.9,r*.9,r*1.05);
 g.addColorStop(0,rgba(scl(mixc(col,WHITE,.7),b),1));g.addColorStop(.28,rgba(scl(mixc(col,WHITE,.12),b),1));g.addColorStop(.75,rgba(scl(col,b*.55),1));g.addColorStop(1,rgba(scl(col,b*.18),1));
 x.fillStyle=g;x.beginPath();x.arc(r,r,r*.97,0,TAU);x.fill();return c}
function blobSpr(seed,col,n,spread,size,o){o=o||{};const rnd=mulberry32(seed),c=mk(size,size),x=c.getContext('2d'),r=size/2,ax=o.ax||1,ay=o.ay||1,sub=o.sub||1,S=[];
 for(let i=0;i<n;i++){const a=rnd()*TAU,d=Math.sqrt(rnd())*spread*r;S.push([r+Math.cos(a)*d*ax,r+Math.sin(a)*d*ay,r*(.16+rnd()*.13)*sub])}
 const dark=scl(col,.3),lite=mixc(col,WHITE,.4);
 x.fillStyle=rgba(dark,1);for(const s of S){x.beginPath();x.arc(s[0],s[1],s[2]+size*.022,0,TAU);x.fill()}
 for(const s of S){const g=x.createRadialGradient(s[0]-s[2]*.35,s[1]-s[2]*.35,0,s[0],s[1],s[2]);g.addColorStop(0,rgba(lite,1));g.addColorStop(1,rgba(col,1));x.fillStyle=g;x.beginPath();x.arc(s[0],s[1],s[2],0,TAU);x.fill()}
 return c}
function blurSpr(img,px){const c=mk(img.width,img.height),x=c.getContext('2d');try{x.filter='blur('+px+'px)'}catch(e){}x.drawImage(img,0,0);return c}
function riboSpr(size){const c=mk(size,size),x=c.getContext('2d');const L=blobSpr(501,[205,90,190],16,.55,Math.round(size*.8)),S=blobSpr(502,[245,175,90],10,.5,Math.round(size*.58));x.drawImage(L,0,size*.2);x.drawImage(S,size*.42,0);return c}
/* world->screen transform for 2D scenes */
function mkT(s,cx,cy,roll){const c=Math.cos(roll),sn=Math.sin(roll);return{s,c,sn,cx,cy,
 set(){ctx.setTransform(DPR*s*c,DPR*s*sn,-DPR*s*sn,DPR*s*c,DPR*(W/2-s*(c*cx-sn*cy)),DPR*(H/2-s*(sn*cx+c*cy)))},
 pt(x,y){const dx=x-cx,dy=y-cy;return[W/2+s*(c*dx-sn*dy),H/2+s*(sn*dx+c*dy)]},
 inv(px,py){const dx=(px-W/2)/s,dy=(py-H/2)/s;return[cx+c*dx+sn*dy,cy-sn*dx+c*dy]},
 rad(){return Math.hypot(W,H)/2/s}}}
/* labels (annotations) */
const LABELS=[];
function lab(p,text,dx,dy){if(p&&p[0]>-50&&p[0]<W+50&&p[1]>-50&&p[1]<H+50)LABELS.push({x:p[0],y:p[1],text,dx,dy})}
function resetCtx(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.setLineDash([])}
/* screen-space helpers for 3D scenes */
function toScr(dx,dy,s,roll){const c=Math.cos(roll),sn=Math.sin(roll);return[W/2+s*(c*dx-sn*dy),H/2+s*(sn*dx+c*dy)]}

/* ---------------- timeline ---------------- */
const STOPS=[{z:5.25,hold:13,travel:6},{z:6.1,hold:8,travel:5},{z:6.97,hold:9,travel:5},{z:8.0,hold:9,travel:5.5},{z:8.72,hold:9,travel:5.5},{z:9.45,hold:9,travel:9.5},{z:13.75,hold:9,travel:5},{z:14.45,hold:10,travel:7},{z:16.35,hold:1e9,travel:0}];
const DRIFT=.06,SEGS=[];
{let T=0;STOPS.forEach((s,i)=>{const last=i===STOPS.length-1;SEGS.push({type:'hold',i,t0:T,t1:T+s.hold,z0:s.z,z1:s.z+(last?0:DRIFT)});T+=s.hold;if(!last){SEGS.push({type:'travel',i,t0:T,t1:T+s.travel,z0:s.z+DRIFT,z1:STOPS[i+1].z});T+=s.travel}})}
function timeline(t){for(const g of SEGS){if(t<g.t1){const u=clamp((g.t1>1e8?0:(t-g.t0)/(g.t1-g.t0)),0,1);let z;
 if(g.type==='hold')z=g.i===STOPS.length-1?g.z0+.3*(1-Math.exp(-(t-g.t0)/22)):lerp(g.z0,g.z1,u);else z=lerp(g.z0,g.z1,easeIO(u));return{z,seg:g,u}}}return{z:16.35,seg:SEGS[SEGS.length-1],u:0}}
const env=(e,z)=>(e[0]<0?1:sstep(e[0],e[1],z))*(1-sstep(e[2],e[3],z));

/* ---------------- shared sprites ---------------- */
const SPR={
 riboDot:glowSpr([240,120,205],32,.3),
 ribo:riboSpr(256),
 rnap:blobSpr(601,[140,110,240],20,.56,256,{ax:1.08,ay:.9}),
 speck:[blobSpr(11,[70,190,180],5,.4,32),blobSpr(12,[90,140,230],5,.4,32),blobSpr(13,[120,205,110],5,.4,32)],
 memP:blobSpr(14,[230,210,110],5,.4,32),
 bead:ballSpr([255,170,60],1,64),
 beadDim:ballSpr([255,170,60],.55,64)
};

/* Coupled transcription-translation complex ("expressome"), coordinates in nm relative to the focus point on the DNA */
const EXPR=(()=>{const rnd=mulberry32(4321),m=[];let x=31,y=-7,a=-.75;
 for(let i=0;i<170;i++){m.push(x,y);a+=(rnd()-.5)*.22+.004;x+=Math.cos(a);y+=Math.sin(a)}
 const ribos=[],lens=[70,52,36,21,9];
 [18,50,82,114,146].forEach((idx,k)=>{const x0=m[idx*2],y0=m[idx*2+1],tx=m[idx*2+2]-m[idx*2-2],ty=m[idx*2+3]-m[idx*2-1],ang=Math.atan2(ty,tx);
  const nx=-Math.sin(ang),ny=Math.cos(ang);const cx=x0+nx*9,cy=y0+ny*9;
  // nascent polypeptide: compact-ish random walk leaving the exit tunnel
  const ch=[];let px=cx+nx*9,py=cy+ny*9,pa=Math.atan2(ny,nx);const n=Math.round(lens[k]/.6);
  for(let j=0;j<n;j++){ch.push(px,py);pa+=(rnd()-.5)*1.3;const dx=px-(cx+nx*16),dy=py-(cy+ny*16),d=Math.hypot(dx,dy);if(d>6+lens[k]*.12)pa=Math.atan2(-dy,-dx)+(rnd()-.5);px+=Math.cos(pa)*.6;py+=Math.sin(pa)*.6}
  ribos.push({x:cx,y:cy,rot:ang,chain:ch})});
 return{rnap:{x:24,y:-1,rot:-.2},mrna:m,ribos}})();

function drawExpr(t,px,alpha){
 ctx.globalAlpha=alpha;ctx.globalCompositeOperation='source-over';
 const m=EXPR.mrna;ctx.beginPath();for(let i=0;i<m.length/2;i++){const x=m[i*2]+.5*noise3(i*.1,t*.4,1),y=m[i*2+1]+.5*noise3(i*.1,t*.4,7);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
 ctx.strokeStyle='rgba(255,150,195,0.95)';ctx.lineWidth=Math.max(.6,1.1*px);ctx.lineJoin='round';ctx.stroke();
 EXPR.ribos.forEach((r,k)=>{const c=r.chain;ctx.beginPath();for(let i=0;i<c.length/2;i++){const x=c[i*2]+.35*noise3(i*.2,t*.6,k*3),y=c[i*2+1]+.35*noise3(i*.2,t*.6,k*3+9);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.strokeStyle='rgba(165,245,140,0.95)';ctx.lineWidth=Math.max(.45,1*px);ctx.stroke()});
 EXPR.ribos.forEach(r=>{ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot+Math.PI);ctx.drawImage(SPR.ribo,-13,-13,26,26);ctx.restore()});
 const R=EXPR.rnap;ctx.save();ctx.translate(R.x,R.y);ctx.rotate(R.rot+.05*Math.sin(t*.7));ctx.globalAlpha=alpha*.96;ctx.drawImage(SPR.rnap,-9.5,-9.5,19,19);ctx.restore();ctx.globalAlpha=alpha}

/* ================= SCENE 1: the cell (units: nm) ================= */
const Cell={env:[-1,-1,6.55,6.95]};
(()=>{
 const rnd=mulberry32(1234),A=760,R=440,F={x:110,y:205};
 const sdf=(x,y)=>Math.hypot(x-clamp(x,-A,A),y)-R;
 const nucF=(x,y)=>x*x/(620*620)+y*y/(255*255)+.5*noise3(x*.0045+10.3,y*.0045+2.1,1.7);
 const PER=4*A+TAU*R;
 function perim(u){let d=((u%1)+1)%1*PER;
  if(d<2*A)return{x:-A+d,y:-R,nx:0,ny:-1};d-=2*A;
  if(d<Math.PI*R){const a=-Math.PI/2+d/R;return{x:A+R*Math.cos(a),y:R*Math.sin(a),nx:Math.cos(a),ny:Math.sin(a)}}d-=Math.PI*R;
  if(d<2*A)return{x:A-d,y:R,nx:0,ny:1};d-=2*A;
  const a=Math.PI/2+d/R;return{x:-A+R*Math.cos(a),y:R*Math.sin(a),nx:Math.cos(a),ny:Math.sin(a)}}
 function capsule(off){const r=R+off;ctx.beginPath();ctx.moveTo(-A,-r);ctx.lineTo(A,-r);ctx.arc(A,0,r,-Math.PI/2,Math.PI/2);ctx.lineTo(-A,r);ctx.arc(-A,0,r,Math.PI/2,Math.PI*1.5);ctx.closePath()}
 const inCell=m=>{for(;;){const x=(rnd()*2-1)*(A+R),y=(rnd()*2-1)*R;if(sdf(x,y)<-m)return[x,y]}};

 /* chromosome: worm-like chains (persistence ~50 nm) confined to the nucleoid, drawn as plectonemic supercoils */
 const STEP=3.2;
 function walk(x,y,a,n,fixed,turn){const p=[x,y];for(let i=1;i<n;i++){if(i>fixed){a+=(rnd()-.5)*turn;const f=nucF(x,y);
   if(f>.85){let d=Math.atan2(-y*2.5,-x)-a;d=Math.atan2(Math.sin(d),Math.cos(d));a+=d*Math.min(.35,(f-.85)*1.2)}
   if(sdf(x,y)>-70){let d=Math.atan2(-y,-x)-a;d=Math.atan2(Math.sin(d),Math.cos(d));a+=d*.4}}
  x+=Math.cos(a)*STEP;y+=Math.sin(a)*STEP;p.push(x,y)}return p}
 const fw=walk(F.x,F.y,0,170,30,.9),bw=walk(F.x,F.y,Math.PI,170,30,.9),c0=[];
 for(let i=bw.length/2-1;i>0;i--)c0.push(bw[i*2],bw[i*2+1]);for(let i=0;i<fw.length;i++)c0.push(fw[i]);
 const CH0=new Float32Array(c0);
 const CHUNKS=[],FAR=[];
 function twist(p,w,period,ph){const n=p.length/2,a=new Float32Array(p.length),b=new Float32Array(p.length);
  for(let i=0;i<n;i++){const i0=Math.max(0,i-1),i1=Math.min(n-1,i+1),tx=p[i1*2]-p[i0*2],ty=p[i1*2+1]-p[i0*2+1],l=Math.hypot(tx,ty)||1,nx=-ty/l,ny=tx/l,o=w*Math.sin(i*STEP/period*TAU+ph);
   a[i*2]=p[i*2]+nx*o;a[i*2+1]=p[i*2+1]+ny*o;b[i*2]=p[i*2]-nx*o;b[i*2+1]=p[i*2+1]-ny*o}return[a,b]}
 function chunk(arr){const n=arr.length/2;for(let i0=0;i0<n-1;i0+=48){const i1=Math.min(n-1,i0+48);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=i0;i<=i1;i++){x0=Math.min(x0,arr[i*2]);x1=Math.max(x1,arr[i*2]);y0=Math.min(y0,arr[i*2+1]);y1=Math.max(y1,arr[i*2+1])}CHUNKS.push({arr,i0,i1,x0,x1,y0,y1})}}
 for(let c=0;c<46;c++){let x,y;do{[x,y]=inCell(80)}while(nucF(x,y)>.75);const p=walk(x,y,rnd()*TAU,430,0,.85);
  const [sa,sb]=twist(p,4.5,24,rnd()*TAU);chunk(sa);chunk(sb);const f=[];for(let i=0;i<p.length/2;i+=5)f.push(p[i*2],p[i*2+1]);FAR.push(new Float32Array(f))}
 /* nucleoid haze */
 const NH=mk(320,140);{const x=NH.getContext('2d'),id=x.createImageData(320,140);for(let j=0;j<140;j++)for(let i=0;i<320;i++){const wx=-800+i*5,wy=-350+j*5,k=(j*320+i)*4,f=nucF(wx,wy);id.data[k]=80;id.data[k+1]=160;id.data[k+2]=255;id.data[k+3]=sstep(1.15,.55,f)*120}x.putImageData(id,0,0)}
 /* crowded cytoplasm texture for the far view */
 const CT=mk(1100,404);{const x=CT.getContext('2d'),cols=[[70,190,180],[90,140,230],[120,205,110],[230,120,200]];for(let i=0;i<70000;i++){const [wx,wy]=inCell(30);x.fillStyle=rgba(cols[(rnd()*4)|0],.25+rnd()*.35);const r=.5+rnd()*1.1;x.fillRect((wx+A+R)/(2*(A+R))*1100-r/2,(wy+R)/(2*R)*404-r/2,r,r)}}
 /* ribosomes: free + polysomes */
 const RB=[],POLY=[];
 for(let p=0;p<40;p++){let x,y;do{[x,y]=inCell(70)}while(nucF(x,y)<1.05);let a=rnd()*TAU;const n=5+(rnd()*6|0),pts=[];for(let k=0;k<n;k++){a+=(rnd()-.5)*.7;x+=Math.cos(a)*30;y+=Math.sin(a)*30;if(sdf(x,y)>-40)break;RB.push([x,y,a+Math.PI/2+(rnd()-.5)*.4,rnd()*TAU]);pts.push(x,y)}if(pts.length>4)POLY.push(pts)}
 while(RB.length<2300){const [x,y]=inCell(40);if(nucF(x,y)<1&&rnd()<.85)continue;if(Math.hypot(x-F.x,y-F.y)<90)continue;RB.push([x,y,rnd()*TAU,rnd()*TAU])}
 /* small proteins */
 const NS=9000,SX=new Float32Array(NS),SY=new Float32Array(NS),SR=new Float32Array(NS),SC=new Uint8Array(NS),SP=new Float32Array(NS);
 for(let i=0;i<NS;i++){let x,y;do{[x,y]=inCell(32)}while(nucF(x,y)<1&&rnd()<.5);SX[i]=x;SY[i]=y;SR[i]=2.5+rnd()*2.2;SC[i]=rnd()*3|0;SP[i]=rnd()*TAU}
 /* flagella: peritrichous, bent into a trailing bundle */

const BGS=[[5,[5,16,28]],[6.5,[5,17,28]],[7.5,[6,12,26]],[8.5,[5,8,22]],[9.8,[3,4,13]],[12,[2,2,6]],[14,[8,3,11]],[15,[11,3,15]],[16.5,[3,3,11]]];

let clock=parseFloat(new URLSearchParams(location.search).get("t"))||0,last=performance.now(),paused=new URLSearchParams(location.search).has("p");
function jump(i){const g=SEGS.find(q=>q.type==='hold'&&q.i===i);if(g){if(g.t0<clock)Dna.spinAcc=0;clock=g.t0+.01}}
function curStop(){const g=timeline(clock).seg;return g.type==='hold'?g.i:g.i+.5}
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault()}else if(e.code==='ArrowRight')jump(Math.min(8,Math.floor(curStop())+1));else if(e.code==='ArrowLeft'){const c=curStop();jump(Math.max(0,Number.isInteger(c)?c-1:Math.floor(c)))}else if(e.key==='r'||e.key==='R')jump(0)});
cv.addEventListener('click',e=>{for(const h of HITS)if(e.clientX>=h.x0&&e.clientX<=h.x1&&e.clientY>=h.y0&&e.clientY<=h.y1){jump(h.i);return}});
cv.addEventListener('mousemove',e=>{cv.style.cursor=HITS.some(h=>e.clientX>=h.x0&&e.clientX<=h.x1&&e.clientY>=h.y0&&e.clientY<=h.y1)?'pointer':'default'});
document.getElementById('replay').addEventListener('click',()=>jump(0));

function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(paused)dt=0;clock+=dt;
 const st=timeline(clock),z=st.z,g=st.seg,roll=-.3+.0045*clock,stop=g.type==='hold'?g.i:-1;
